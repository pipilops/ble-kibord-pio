; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Serial monitor ---
monitor_speed = 115200

; --- Libraries ---
; BleKeyboard by T-vK (https://github.com/T-vK/ESP32-BLE-Keyboard)
;
; EspUsbHost + EspUsbHostKeybord (by TANAKA Masayuki, v1.0.1) are vendored
; directly in lib/EspUsbHost/ using your original source files - no
; lib_deps entry needed, PlatformIO picks up private libraries in lib/
; automatically.
lib_deps =
    t-vk/ESP32 BLE Keyboard @ ^0.3.2

; --- Build flags ---
; USB Host mode on the S3 needs the native USB OTG peripheral available
; (not routed to CDC/JTAG), so board_build.usb_mode below sets that up.
; The esp32-s3-devkitc-1 board manifest already defines ARDUINO_USB_MODE,
; so we unflag it first to avoid a harmless "redefined" compiler warning.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
